<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" font-family="system-ui,Segoe UI,Roboto,sans-serif">
  <defs>
    <pattern id="foam" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="#fff3d6"/><circle cx="4.5" cy="4.5" r="1.4" fill="#e2c98a"/></pattern>
    <pattern id="mesh" width="9" height="9" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="9" stroke="#0c3346" stroke-width="1.2" stroke-opacity="0.55"/></pattern>
    <linearGradient id="pan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#28507f"/><stop offset="1" stop-color="#0c1f3a"/></linearGradient>
    <style>
      .cell{fill:#fbfdfe;stroke:#cdd6da;stroke-width:1.5;rx:10}
      .ct{fill:#0c2230;font-size:16px;font-weight:700}
      .ln{stroke:#1b2b33;stroke-width:2;fill:none}
      .met{fill:#cfd8dd;stroke:#8b969c;stroke-width:2}
      .pcb{fill:#dfe9f5;stroke:#3667a3;stroke-width:1.6}
      .bat{fill:#cfe6d2;stroke:#3a7d4a;stroke-width:1.8}
      .t{fill:#0c2230;font-size:12px}
      .lead{stroke:#5a6b73;stroke-width:1;stroke-dasharray:3 3;fill:none}
      .lbl{fill:#33444c;font-size:12px}
    </style>
  </defs>
  <rect width="1200" height="840" fill="#ffffff"/>
  <text x="30" y="40" class="ct" font-size="21">Robot Piscina — Spaccati dei componenti</text>

  <!-- ===== Cella 1: Pontone ===== -->
  <g transform="translate(20,64)">
    <rect class="cell" width="370" height="360"/>
    <text x="16" y="30" class="ct">1 · Pontone (galleggiante)</text>
    <!-- tubo -->
    <rect x="60" y="150" width="230" height="80" rx="10" fill="url(#foam)" stroke="#b9831a" stroke-width="2.6"/>
    <!-- tappo sinistro -->
    <ellipse cx="60" cy="190" rx="14" ry="40" fill="#f1cd7e" stroke="#b9831a" stroke-width="2.6"/>
    <!-- sezione destra (foam visibile) -->
    <ellipse cx="290" cy="190" rx="14" ry="40" fill="url(#foam)" stroke="#b9831a" stroke-width="2.6"/>
    <!-- leaders -->
    <line x1="60" y1="155" x2="60" y2="100" class="lead"/><text x="20" y="94" class="lbl">Tappo sigillato</text>
    <line x1="175" y1="150" x2="175" y2="110" class="lead"/><text x="120" y="104" class="lbl">Tubo PVC Ø75 mm</text>
    <line x1="220" y1="230" x2="220" y2="300" class="lead"/><text x="70" y="318" class="lbl">Schiuma = galleggiamento di riserva</text>
  </g>

  <!-- ===== Cella 2: Vano elettronica ===== -->
  <g transform="translate(410,64)">
    <rect class="cell" width="370" height="360"/>
    <text x="16" y="30" class="ct">2 · Vano elettronica stagno (IP65)</text>
    <!-- box (vista dall'alto, aperto) -->
    <rect x="40" y="70" width="250" height="240" rx="8" fill="#f7fafb" stroke="#1b2b33" stroke-width="2.4"/>
    <!-- componenti -->
    <rect x="56" y="240" width="218" height="56" rx="4" class="bat"/><text x="120" y="273" class="t">Batteria 2S LiPo</text>
    <rect x="56" y="86" width="100" height="30" rx="4" class="pcb"/><text x="76" y="105" class="t">ESP32</text>
    <rect x="172" y="86" width="102" height="30" rx="4" class="pcb"/><text x="186" y="105" class="t">2×DRV8833</text>
    <rect x="56" y="126" width="100" height="28" rx="4" class="pcb"/><text x="78" y="144" class="t">buck 5V</text>
    <rect x="172" y="126" width="102" height="28" rx="4" fill="#f5e6c8" stroke="#b08a2a" stroke-width="1.6"/><text x="186" y="144" class="t">MPPT</text>
    <rect x="56" y="166" width="100" height="28" rx="4" fill="#f3dede" stroke="#b04a4a" stroke-width="1.6"/><text x="64" y="184" class="t">fus.+switch</text>
    <!-- pressacavi -->
    <circle cx="290" cy="172" r="7" class="met"/><circle cx="290" cy="200" r="7" class="met"/>
    <line x1="283" y1="186" x2="214" y2="210" class="lead"/><text x="172" y="226" class="lbl">pressacavi</text>
    <text x="50" y="334" class="lbl">Coperchio con guarnizione + conformal coating</text>
  </g>

  <!-- ===== Cella 3: Cestello skimmer ===== -->
  <g transform="translate(800,64)">
    <rect class="cell" width="370" height="360"/>
    <text x="16" y="30" class="ct">3 · Cestello a rete (skimmer)</text>
    <!-- cornice + rete -->
    <rect x="90" y="120" width="190" height="150" rx="8" fill="url(#mesh)" stroke="#0c3346" stroke-width="3"/>
    <!-- manico -->
    <path d="M150 120 q35 -40 70 0" fill="none" stroke="#0c3346" stroke-width="3"/>
    <!-- freccia estraibile -->
    <line x1="185" y1="120" x2="185" y2="64" class="ln"/><path d="M178 78 L185 64 L192 78 Z" fill="#1b2b33"/>
    <text x="200" y="74" class="lbl">estraibile (svuotamento)</text>
    <line x1="280" y1="160" x2="330" y2="150" class="lead"/><text x="285" y="145" class="lbl">cornice</text>
    <line x1="200" y1="270" x2="200" y2="310" class="lead"/><text x="120" y="328" class="lbl">rete a maglia fine</text>
  </g>

  <!-- ===== Cella 4: Spazzola laterale ===== -->
  <g transform="translate(20,440)">
    <rect class="cell" width="370" height="360"/>
    <text x="16" y="30" class="ct">4 · Spazzola pulizia bordo</text>
    <!-- motoriduttore -->
    <rect x="50" y="150" width="70" height="64" rx="6" class="met"/>
    <text x="44" y="240" class="lbl">motoriduttore</text>
    <!-- albero -->
    <line x1="120" y1="182" x2="150" y2="182" class="ln" stroke-width="3"/>
    <!-- rullo nylon con setole -->
    <rect x="150" y="150" width="150" height="64" rx="32" fill="#eef3f5" stroke="#1b2b33" stroke-width="2.2"/>
    <g stroke="#9aa6ad" stroke-width="2">
      <line x1="168" y1="150" x2="168" y2="214"/><line x1="186" y1="150" x2="186" y2="214"/><line x1="204" y1="150" x2="204" y2="214"/>
      <line x1="222" y1="150" x2="222" y2="214"/><line x1="240" y1="150" x2="240" y2="214"/><line x1="258" y1="150" x2="258" y2="214"/>
      <line x1="276" y1="150" x2="276" y2="214"/>
    </g>
    <line x1="225" y1="214" x2="225" y2="260" class="lead"/><text x="170" y="278" class="lbl">rullo in nylon</text>
    <!-- staffa -->
    <rect x="60" y="120" width="250" height="14" rx="6" fill="#dfe9f5" stroke="#3667a3" stroke-width="1.6"/>
    <text x="120" y="112" class="lbl">staffa di fissaggio</text>
  </g>

  <!-- ===== Cella 5: Gruppo propulsione ===== -->
  <g transform="translate(410,440)">
    <rect class="cell" width="370" height="360"/>
    <text x="16" y="30" class="ct">5 · Gruppo propulsione</text>
    <!-- motore -->
    <rect x="50" y="160" width="90" height="56" rx="8" class="met"/>
    <text x="58" y="240" class="lbl">motore DC</text>
    <!-- albero + tenuta -->
    <line x1="140" y1="188" x2="220" y2="188" class="ln" stroke-width="3"/>
    <rect x="186" y="172" width="20" height="32" rx="4" fill="#f5e6c8" stroke="#b08a2a" stroke-width="1.8"/>
    <line x1="196" y1="172" x2="196" y2="120" class="lead"/><text x="120" y="112" class="lbl">tenuta albero (grasso silicone)</text>
    <!-- elica -->
    <g transform="translate(232,188)">
      <ellipse cx="0" cy="0" rx="10" ry="34" fill="#8fa1aa" stroke="#5d6b72" stroke-width="1.8"/>
      <ellipse cx="0" cy="0" rx="34" ry="10" fill="#8fa1aa" stroke="#5d6b72" stroke-width="1.8" opacity="0.6"/>
      <circle r="6" fill="#34424a"/>
    </g>
    <line x1="232" y1="222" x2="232" y2="262" class="lead"/><text x="205" y="280" class="lbl">elica</text>
    <text x="50" y="320" class="lbl">2 gruppi = sterzo differenziale</text>
  </g>

  <!-- ===== Cella 6: Pannello + regolatore ===== -->
  <g transform="translate(800,440)">
    <rect class="cell" width="370" height="360"/>
    <text x="16" y="30" class="ct">6 · Pannello solare + ricarica</text>
    <!-- pannello -->
    <rect x="70" y="64" width="230" height="70" rx="4" fill="url(#pan)" stroke="#0a1730" stroke-width="2"/>
    <g stroke="#3d6ea5" stroke-width="1.4"><line x1="70" y1="99" x2="300" y2="99"/><line x1="128" y1="64" x2="128" y2="134"/><line x1="185" y1="64" x2="185" y2="134"/><line x1="242" y1="64" x2="242" y2="134"/></g>
    <text x="86" y="155" class="lbl">Pannello 6–10 W (sul ponte)</text>
    <!-- cavo + diodo -->
    <line x1="185" y1="134" x2="185" y2="180" class="ln"/>
    <polygon points="175,176 195,176 185,192" fill="none" stroke="#1b2b33" stroke-width="2"/>
    <line x1="175" y1="192" x2="195" y2="192" class="ln"/>
    <text x="200" y="186" class="lbl">diodo di blocco</text>
    <!-- regolatore MPPT -->
    <rect x="120" y="206" width="130" height="46" rx="6" fill="#f5e6c8" stroke="#b08a2a" stroke-width="2"/>
    <text x="138" y="234" class="t">Regolatore MPPT</text>
    <!-- batteria -->
    <line x1="185" y1="252" x2="185" y2="282" class="ln"/>
    <rect x="120" y="282" width="130" height="40" rx="5" class="bat"/>
    <text x="150" y="307" class="t">Batteria 2S</text>
  </g>
</svg>
