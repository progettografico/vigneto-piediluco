<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="system-ui,Segoe UI,Roboto,sans-serif">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1aa7d0"/>
      <stop offset="1" stop-color="#0d6ea0"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3f6f8"/>
      <stop offset="1" stop-color="#c2ccd2"/>
    </linearGradient>
    <linearGradient id="pont" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#e8a51b"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c3a63"/>
      <stop offset="1" stop-color="#0c1f3a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff4c2"/>
      <stop offset="1" stop-color="#ffcf3f"/>
    </radialGradient>
    <pattern id="mesh" width="10" height="10" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#dff0f4" fill-opacity="0.25"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#0c3346" stroke-width="1.2" stroke-opacity="0.5"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- Acqua -->
  <rect x="0" y="0" width="960" height="620" fill="url(#water)"/>
  <g stroke="#bfeaf5" stroke-opacity="0.35" stroke-width="3" fill="none">
    <path d="M0 120 q40 -12 80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0"/>
    <path d="M0 540 q40 -12 80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0"/>
    <path d="M0 575 q40 -12 80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0"/>
  </g>

  <!-- Sole -->
  <g>
    <g stroke="#ffe17a" stroke-width="6" stroke-linecap="round">
      <line x1="868" y1="22" x2="868" y2="46"/>
      <line x1="924" y1="78" x2="900" y2="78"/>
      <line x1="908" y1="38" x2="892" y2="54"/>
      <line x1="828" y1="38" x2="844" y2="54"/>
    </g>
    <circle cx="868" cy="78" r="34" fill="url(#sun)"/>
  </g>
  <!-- raggi verso il pannello -->
  <g stroke="#fff2bf" stroke-opacity="0.45" stroke-width="5" stroke-linecap="round">
    <line x1="845" y1="105" x2="560" y2="300"/>
    <line x1="872" y1="112" x2="610" y2="300"/>
  </g>

  <!-- Ombra sull'acqua -->
  <ellipse cx="445" cy="380" rx="250" ry="120" fill="#063a55" fill-opacity="0.45" filter="url(#soft)"/>

  <!-- Pontone superiore (giallo) -->
  <path d="M300 232 L632 232 Q654 232 654 254 L654 280 Q654 302 632 302 L300 302 Q250 302 224 267 Q250 232 300 232 Z" fill="url(#pont)" stroke="#b9831a" stroke-width="2"/>
  <!-- Pontone inferiore -->
  <path d="M300 380 L632 380 Q654 380 654 402 L654 426 Q654 448 632 448 L300 448 Q250 448 224 413 Q250 380 300 380 Z" fill="url(#pont)" stroke="#b9831a" stroke-width="2"/>

  <!-- Vano scafo centrale -->
  <rect x="322" y="288" width="318" height="104" rx="16" fill="url(#hull)" stroke="#9aa6ad" stroke-width="2"/>

  <!-- Cestello a rete (skimmer) a prua -->
  <path d="M350 256 L350 424 L262 396 L262 284 Z" fill="url(#mesh)" stroke="#0c3346" stroke-width="2.5"/>
  <path d="M350 256 L350 424" stroke="#0c3346" stroke-width="3"/>

  <!-- Pannello solare sul ponte -->
  <g>
    <rect x="352" y="250" width="252" height="180" rx="8" fill="url(#panel)" stroke="#0a1730" stroke-width="3"/>
    <g stroke="#3d6ea5" stroke-width="2" stroke-opacity="0.9">
      <line x1="352" y1="295" x2="604" y2="295"/>
      <line x1="352" y1="340" x2="604" y2="340"/>
      <line x1="352" y1="385" x2="604" y2="385"/>
      <line x1="415" y1="250" x2="415" y2="430"/>
      <line x1="478" y1="250" x2="478" y2="430"/>
      <line x1="541" y1="250" x2="541" y2="430"/>
    </g>
    <!-- riflesso -->
    <polygon points="360,250 430,250 360,430" fill="#ffffff" fill-opacity="0.10"/>
  </g>

  <!-- Spazzola bordo (cilindro con setole) -->
  <g>
    <rect x="360" y="452" width="210" height="26" rx="13" fill="#cfd8dd" stroke="#8b969c" stroke-width="2"/>
    <g stroke="#7c878d" stroke-width="2">
      <line x1="378" y1="452" x2="378" y2="478"/><line x1="398" y1="452" x2="398" y2="478"/>
      <line x1="418" y1="452" x2="418" y2="478"/><line x1="438" y1="452" x2="438" y2="478"/>
      <line x1="458" y1="452" x2="458" y2="478"/><line x1="478" y1="452" x2="478" y2="478"/>
      <line x1="498" y1="452" x2="498" y2="478"/><line x1="518" y1="452" x2="518" y2="478"/>
      <line x1="538" y1="452" x2="538" y2="478"/><line x1="558" y1="452" x2="558" y2="478"/>
    </g>
    <ellipse cx="360" cy="465" rx="7" ry="13" fill="#aeb8be"/>
    <ellipse cx="570" cy="465" rx="7" ry="13" fill="#aeb8be"/>
  </g>

  <!-- Eliche (propulsione) a poppa -->
  <g>
    <g transform="translate(672,267)">
      <circle r="18" fill="#34424a" stroke="#1b2429" stroke-width="2"/>
      <g fill="#8fa1aa"><ellipse cx="0" cy="-10" rx="5" ry="10"/><ellipse cx="9" cy="6" rx="5" ry="10" transform="rotate(120)"/><ellipse cx="-9" cy="6" rx="5" ry="10" transform="rotate(240)"/></g>
      <circle r="4" fill="#dfe7ea"/>
    </g>
    <g transform="translate(672,413)">
      <circle r="18" fill="#34424a" stroke="#1b2429" stroke-width="2"/>
      <g fill="#8fa1aa"><ellipse cx="0" cy="-10" rx="5" ry="10"/><ellipse cx="9" cy="6" rx="5" ry="10" transform="rotate(120)"/><ellipse cx="-9" cy="6" rx="5" ry="10" transform="rotate(240)"/></g>
      <circle r="4" fill="#dfe7ea"/>
    </g>
    <!-- scia -->
    <path d="M690 250 q40 17 0 34" stroke="#cdeef7" stroke-width="4" fill="none" stroke-opacity="0.6"/>
    <path d="M690 396 q40 17 0 34" stroke="#cdeef7" stroke-width="4" fill="none" stroke-opacity="0.6"/>
  </g>

  <!-- WiFi -->
  <g transform="translate(478,210)" stroke="#eafaff" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M-22 0 a31 31 0 0 1 44 0" stroke-opacity="0.9"/>
    <path d="M-13 9 a18 18 0 0 1 26 0" stroke-opacity="0.9"/>
    <circle cx="0" cy="18" r="2.5" fill="#eafaff" stroke="none"/>
  </g>

  <!-- Titolo -->
  <text x="36" y="52" fill="#ffffff" font-size="26" font-weight="700">Robot Piscina — render concettuale</text>
  <text x="36" y="78" fill="#dff0f7" font-size="15">Skimmer galleggiante a pannello solare · WiFi · pulizia superficie e bordi</text>

  <!-- Etichette con linee guida -->
  <g font-size="14" fill="#06283a">
    <!-- Pannello solare -->
    <line x1="478" y1="250" x2="478" y2="150" stroke="#06283a" stroke-width="1.5" stroke-dasharray="3 3"/>
    <rect x="372" y="120" width="212" height="28" rx="6" fill="#eafaff" stroke="#06283a"/>
    <text x="384" y="139" font-weight="600">☀ Pannello solare (ricarica)</text>

    <!-- WiFi label -->
    <rect x="600" y="150" width="150" height="28" rx="6" fill="#eafaff" stroke="#06283a"/>
    <line x1="520" y1="205" x2="600" y2="170" stroke="#06283a" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="612" y="169" font-weight="600">WiFi (ESP32) + app</text>

    <!-- Cestello -->
    <line x1="300" y1="340" x2="150" y2="430" stroke="#06283a" stroke-width="1.5" stroke-dasharray="3 3"/>
    <rect x="40" y="432" width="226" height="28" rx="6" fill="#eafaff" stroke="#06283a"/>
    <text x="52" y="451" font-weight="600">Cestello a rete (skimmer)</text>

    <!-- Spazzola -->
    <line x1="465" y1="478" x2="465" y2="520" stroke="#06283a" stroke-width="1.5" stroke-dasharray="3 3"/>
    <rect x="360" y="522" width="210" height="28" rx="6" fill="#eafaff" stroke="#06283a"/>
    <text x="372" y="541" font-weight="600">Spazzola pulizia bordo</text>

    <!-- Eliche -->
    <line x1="690" y1="340" x2="780" y2="380" stroke="#06283a" stroke-width="1.5" stroke-dasharray="3 3"/>
    <rect x="730" y="382" width="200" height="28" rx="6" fill="#eafaff" stroke="#06283a"/>
    <text x="742" y="401" font-weight="600">Eliche (differential drive)</text>

    <!-- Pontoni -->
    <line x1="300" y1="266" x2="210" y2="116" stroke="#06283a" stroke-width="1.5" stroke-dasharray="3 3"/>
    <rect x="92" y="86" width="248" height="28" rx="6" fill="#eafaff" stroke="#06283a"/>
    <text x="104" y="105" font-weight="600" font-size="13">Pontoni galleggianti (catamarano)</text>
  </g>
</svg>
